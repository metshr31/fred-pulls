name: Run ATA Truck Tonnage Forecast Model

on:
  workflow_dispatch:

jobs:
  run-truck-tonnage-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn openpyxl

      - name: Restore FRED download cache
        uses: actions/cache@v4
        with:
          path: fred_download_cache
          key: fred-download-cache-forecast-v1-${{ github.run_id }}
          restore-keys: |
            fred-download-cache-forecast-v1-
            fred-download-cache-v3-
            fred-download-cache-v2-

      - name: Confirm FRED_API_KEY is present
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("FRED_API_KEY"):
              raise RuntimeError("FRED_API_KEY secret is not available to this workflow.")
          print("FRED_API_KEY is available.")
          PY

      - name: Confirm forecast script options
        run: |
          python atatonnagetest.py --help

      - name: Run ATA Truck Tonnage forecast model
        run: |
          python atatonnagetest.py --max-series 75 --max-model-features 15

      - name: Upload forecast workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ata-truck-tonnage-forecast-model
          path: ata_truck_tonnage_forecast_model.xlsx
          if-no-files-found: warn

      - name: Upload FRED cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fred-download-cache
          path: fred_download_cache/
          if-no-files-found: ignore
