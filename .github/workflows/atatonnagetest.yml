name: Run ATA Truck Tonnage Feature Screen

on:
  workflow_dispatch:

jobs:
  run-truck-tonnage-screen:
    runs-on: ubuntu-latest

    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn openpyxl fredapi

      - name: Run ATA Truck Tonnage feature screen
        run: |
          python atatonnagetest.py

      - name: Upload Excel output
        uses: actions/upload-artifact@v4
        with:
          name: ata-truck-tonnage-feature-screen
          path: ata_truck_tonnage_feature_screen.xlsx

      - name: Upload FRED cache
        uses: actions/upload-artifact@v4
        with:
          name: fred-download-cache
          path: fred_download_cache/
          if-no-files-found: ignore
