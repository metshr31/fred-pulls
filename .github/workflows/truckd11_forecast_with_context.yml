name: Truck Tonnage Forecast With Context

on:
  workflow_dispatch:
    inputs:
      max_series:
        description: "Maximum FRED series to download/test"
        required: false
        default: "75"
      max_model_features:
        description: "Maximum selected model features per horizon"
        required: false
        default: "75"
      walk_forward_step:
        description: "Walk-forward step size in months"
        required: false
        default: "3"
  schedule:
    # Runs on the 20th and 30th of every month at 6:00 PM ET during standard time / 7:00 PM ET during daylight time.
    # GitHub cron is UTC only.
    - cron: "0 23 20,30 * *"

permissions:
  contents: read

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn openpyxl

      - name: Run TRUCKD11 forecast and context model
        run: |
          python scripts/atatonnagetest_with_context.py \
            --output ata_truck_tonnage_forecast_model_with_context.xlsx \
            --cache-dir fred_download_cache \
            --max-series "${{ github.event.inputs.max_series || '75' }}" \
            --max-model-features "${{ github.event.inputs.max_model_features || '75' }}" \
            --walk-forward-step "${{ github.event.inputs.walk_forward_step || '3' }}"

      - name: Upload workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: truckd11-forecast-with-context
          path: ata_truck_tonnage_forecast_model_with_context.xlsx
          if-no-files-found: error
