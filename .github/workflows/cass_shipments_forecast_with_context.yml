name: Cass Shipments Forecast With Context

on:
  workflow_dispatch:
  schedule:
    # Run at 10:30 AM ET-ish on the 20th and 30th.
    # GitHub cron is UTC; 14:30 UTC is 10:30 AM EDT and 9:30 AM EST.
    - cron: "30 14 20,30 * *"

jobs:
  run-cass-shipments-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn openpyxl

      - name: Run Cass Shipments forecast with context layer
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python cass_shipments_forecast_with_context.py \
            --output cass_freight_shipments_forecast_model_with_context.xlsx \
            --max-series 125 \
            --max-model-features 100 \
            --walk-forward-step 3 \
            --min-train-months 120

      - name: Upload forecast workbook
        uses: actions/upload-artifact@v4
        with:
          name: cass-shipments-forecast-with-context
          path: cass_freight_shipments_forecast_model_with_context.xlsx

      - name: Upload cache snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fred-download-cache-cass-shipments
          path: fred_download_cache/
          if-no-files-found: ignore
